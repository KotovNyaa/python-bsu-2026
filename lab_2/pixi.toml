[workspace]
name = "lab_2"
version = "0.1.0"
authors = ["Kotovnya <kotov.nya.q@gmail.com>"]
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = ">=3.11,<3.13"
pandas = ">=2.0.0"
numpy = ">=1.24.0"
scipy = ">=1.10.0"
matplotlib = ">=3.7.0"
seaborn = ">=0.12.0"
scikit-learn = ">=1.3.0"
openpyxl = ">=3.1.0"
pyarrow = ">=25.0.0,<26"

[feature.dev.dependencies]
pytest = ">=8.0.0"
ruff = ">=0.3.0"

[environments]
default = ["dev"]

[tasks]
test = "python -m pytest"
lint = "ruff check lab tests"
format = "ruff format lab tests"
